name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The wasm is built once and shared. Building it per job would triple the
  # slowest step for no extra signal, and would let the node and browser suites
  # test two separately-compiled binaries — precisely the class of difference
  # this repo keeps finding by accident.
  build:
    name: build wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins both the version and the wasm32 target, so
      # rustup installs the right thing without this workflow restating it.
      # Installed explicitly rather than trusting rustup to auto-install from
      # rust-toolchain.toml, which has varied between rustup versions. The
      # channel, target and components all still come from that file — this
      # workflow does not restate the version.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: build

      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      # Pinned, and deliberately not `apt install binaryen`: Ubuntu noble ships
      # binaryen 108, from 2022. That wasm-opt mangles the externref table this
      # wasm-bindgen emits, producing a binary that cannot instantiate at all —
      # and it does so silently, so the build still reports success.
      - name: Install binaryen
        env:
          BINARYEN_VERSION: version_131
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz -C /opt
          echo "/opt/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify wasm-opt
        run: wasm-opt --version

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Build dist/
        run: bun run build

      # A build that emits an unusable artifact must fail here, not two jobs
      # later with an error that points nowhere near the cause.
      - name: Smoke-check the built package
        run: |
          node test/support/make-crafted-fixtures.ts
          node scripts/smoke.mjs

      # The differential suite compares against calamine read natively, so the
      # node job needs this binary. Building it here keeps Rust out of that job.
      - name: Build native reference dumper
        run: cargo build --release --example dump_native

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: dump_native
          path: target/release/examples/dump_native
          retention-days: 7

  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installed explicitly rather than trusting rustup to auto-install from
      # rust-toolchain.toml, which has varied between rustup versions. The
      # channel, target and components all still come from that file — this
      # workflow does not restate the version.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The .wasm statically links ~50 crates, and MIT and Apache-2.0 both require
  # their notices to ship with a binary containing the code. That makes
  # THIRD-PARTY-LICENSES.md a licence obligation rather than a generated
  # convenience, so it has to be checked like one: a dependency bump that adds a
  # crate, or one that changes licence, fails here rather than shipping
  # unattributed. `accepted` in about.toml also rejects anything copyleft.
  licenses:
    name: licence attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: licenses
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - uses: oven-sh/setup-bun@v2

      # Regenerates in place and fails if the committed file moved. The failure
      # is readable as a diff, and the fix is to run `bun run licenses` locally.
      - run: bun run licenses:check

  node:
    name: node suites
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: dump_native
          path: target/release/examples/
      - name: Restore the executable bit
        # upload-artifact does not preserve file modes.
        run: chmod +x target/release/examples/dump_native

      # The corpus is pinned to a tag inside the script, so the script's hash is
      # the cache key: a hit means the same 134 files, and bumping the tag misses
      # on purpose.
      - name: Cache calamine corpus
        uses: actions/cache@v6
        with:
          path: test/fixtures/calamine
          key: calamine-corpus-${{ hashFiles('test/support/fetch-fixtures.sh') }}

      - name: Fixtures
        run: bun run fixtures:small

      # Runs before the suites and against the built dist/, because that is the
      # point: dist/*.d.ts is hand-written against a wasm binary, and the suites
      # importing the package as TypeScript are the only thing that checks those
      # declarations are true. A type error here is a wrong declaration shipping
      # to users, not a test problem.
      - run: bun run typecheck

      - run: bun run test:node

      # The README's opening snippet, run for real. A quickstart that no longer
      # works is worse than none, and it is the first thing anyone tries.
      - run: node examples/js/quickstart.ts

  browser:
    name: browser suite
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        # Re-run even on a cache hit: --with-deps installs system libraries via
        # apt, which the cached path does not cover.
        run: bunx playwright install --with-deps chromium

      # This suite serves fixtures over HTTP but runs no differential pass, so
      # it needs the small fixtures and not the corpus.
      - name: Fixtures
        run: |
          node bench/make-fixtures.mjs small
          node test/support/make-date-fixture.ts
          node test/support/make-crafted-fixtures.ts

      - run: bun run test:browser

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
