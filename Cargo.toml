[package]
name = "calamine-wasm"
# This crate is never released to crates.io — it exists only to be compiled to
# wasm and assembled into the npm package, whose version in package.json is the
# one that means anything. Hence `publish = false` and an inert version here,
# rather than a second number to keep in sync for no reader's benefit.
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No `dates` feature, and no chrono. That feature gates nothing but the
# `as_datetime`/`as_duration` chrono helpers — date *detection* from number
# formats is always on. `ExcelDateTime::to_ymd_hms_milli` gives us the civil
# fields directly, with millisecond precision and 1900/1904 handled internally.
calamine = "0.36"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps object keys in sheet-column order. Without it
# serde_json sorts them alphabetically, which silently rearranges the columns.
serde_json = { version = "1", features = ["preserve_order"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[profile.release]
# Optimised for throughput, not size. That is a real trade rather than a default:
# the binary ships to browsers, where its 370 KB gzipped is a cost every visitor
# pays, and `opt-level = "z"` would cut it. But reading large files quickly is
# the entire reason to choose this over SheetJS, so speed wins. Revisit if size
# turns out to be the complaint people actually have.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
